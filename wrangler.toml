name = "najma-web"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-07-21"
compatibility_flags = ["nodejs_compat"]

[vars]
GOOGLE_SHEET_ID = "1ZxcUlawXOP0DH-fHl7MJ1-HPh1WNDjLqVV321881Nbw"
GOOGLE_BOOKINGS_SHEET_NAME = "Bookings"
GOOGLE_CUSTOMERS_SHEET_NAME = "Customers"
BLOG_PROVIDER = "sanity"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
# "404-page" short-circuits browser navigations (Sec-Fetch-Mode: navigate) to the
# static 404.html and never invokes the Worker — breaking SSR routes like /blogs/.
not_found_handling = "none"
# Ensure the Worker runs first so legacy-route middleware can intercept old
# WordPress URLs before the assets handler serves a static 404.
run_worker_first = true

[[ratelimits]]
name = "LEAD_RATE_LIMITER"
namespace_id = "1001"

[ratelimits.simple]
limit = 8
period = 60

[[ratelimits]]
name = "ADMIN_RATE_LIMITER"
namespace_id = "1002"

[ratelimits.simple]
limit = 60
period = 60
